{% load static %}
<header class="header" id="mainHeader">
    <div class="header-container">
        <a href="/" class="logo-area">
            <img src="{% static 'images/Logo_Circle_NoText.png' %}" alt="Marketin Burada Logo">
            <span>Marketin Burada</span>
        </a>
        <div class="header-links">
            <a href="/markets/">Marketler</a>
            <a href="/about/">Hakkımızda</a>
                
            <div class="auth-links">
                <a href="/login/" class="btn-login">Giriş Yap</a>
                <a href="/register/" class="btn-primary">Kayıt Ol</a>
            </div>
        </div>
    </div>
</header>

<script>
    function initHeaderDynamics() {
    const header = document.getElementById('mainHeader');
    
    if (!header) return;

    window.addEventListener('scroll', function () {
        if (window.scrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });
}
</script>
