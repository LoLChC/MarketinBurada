{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <!-- Ortak stiller -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="{% static "images/Logo_Circle_NoText.png" %}" type="png">
    <link rel="stylesheet" href="{% static "css/layout.css" %}?v={random_number}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "partials/_header.html" %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include "partials/_footer.html" %}
</body>
    <script src="{% static "js/layout.js" %}"></script>
    {% block js_code %}{% endblock %}
</html>
